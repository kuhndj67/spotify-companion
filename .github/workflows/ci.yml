name: CI

on:
  push:
    branches: [main]
    # U9 (BR-72.1, P-70): a pushed release tag runs the SAME jobs as main, then `publish`. Pushing the tag is the
    # owner's act; `npm run release` tags locally and never pushes.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      fc_seed:
        description: 'fast-check seed to replay a specific failing run'
        required: false
        type: string

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ⚠️ U8 (2026-10-14): `shell: bash` makes GitHub run every step as `bash -eo pipefail`. Without it the default is
# `bash -e`, and `npm run test:coverage 2>&1 | tee test-output.txt` took TEE's exit code -- so a FAILING TEST NEVER
# FAILED CI, from the day that step was written. Found by the BR-63.5 positive control (a PR with a deliberately
# failing test went green). test/rulesetMatchesWorkflow.test.ts pins this line.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Typecheck, test, smoke, knip, build
    runs-on: ubuntu-latest

    env:
      # PBT-08: property tests must be reproducible. A per-run seed keeps the search space
      # moving (a frozen seed would only ever explore the same inputs), while being logged
      # and replayable — either from the run summary below, or by re-running this workflow
      # via workflow_dispatch with that seed.
      FC_SEED: ${{ inputs.fc_seed || github.run_id }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # U7 (PBT-66, P-54): a test scans the MCP server's SOURCE for every error template, so that moving the
      # server to a version with reworded errors fails here instead of silently reading as "Spotify: ok". Fetch
      # the ref the DEPLOYMENT builds: compose.yaml PINS it (R7, 2026-08-25) and overrides the Dockerfile's
      # `main` default. ⚠️ Corrected 2026-10-09: this first read the Dockerfile default and so scanned `main`,
      # not what is deployed. Source only -- nothing is built or run. Without it the test FAILS with a reason.
      - name: Fetch the MCP server source (PBT-66 scans it)
        run: |
          REF=$(sed -n 's/^ *MCP_SERVER_REF: *//p' compose.yaml | head -1)
          if [ -z "$REF" ]; then REF=$(sed -n 's/^ARG MCP_SERVER_REF=//p' Dockerfile); fi
          echo "MCP server ref: $REF"
          git init -q .mcp-server
          git -C .mcp-server remote add origin https://github.com/marcelmarais/spotify-mcp-server.git
          git -C .mcp-server fetch --depth 1 origin "$REF"
          git -C .mcp-server checkout -q FETCH_HEAD

      - name: Typecheck (src and test)
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage 2>&1 | tee test-output.txt

      - name: Build
        run: npm run build

      # U8 (BR-63.2, NFR-31). ⚠️ A LOAD CHECK, NOT A BEHAVIOUR CHECK: it proves every script's modules load and
      # that each script starts in its safe mode. A non-zero exit from a script that REFUSES (no data/, no
      # container) is a pass. A green `smoke` never means "the scripts work" -- they are untested (W-6).
      # Probed 2026-10-14 in a fresh clone with no data/, secrets/ or state/, which is what this runner has.
      - name: Smoke — LOAD check only (scripts' behaviour is NOT tested)
        run: npm run smoke

      # Dead files, exports and dependencies over src/ AND scripts/ (knip.jsonc).
      - name: Knip
        run: npm run knip

      # PBT-08 requires the seed to be discoverable after the fact. Surfacing it in the run
      # summary means a failure can be replayed without digging through raw logs.
      - name: Report fast-check seed and coverage
        if: always()
        run: |
          {
            echo '## Property-based testing'
            echo
            echo "Seed: \`${FC_SEED}\`"
            echo
            echo 'Replay locally:'
            echo '```bash'
            grep -oE 'FC_SEED=[0-9]+ npm test' test-output.txt | head -1 || echo "FC_SEED=${FC_SEED} npm test"
            echo '```'
            echo
            echo '## Coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt \
              | grep -vE 'node_modules' | sed 's/^# //' || echo 'No coverage report produced.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt
          retention-days: 7

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The connector is built at the PINNED ref (the Dockerfile's default, a checked copy of compose.yaml's: U9), with
      # the guarded patch and upstream's own test suite. A failure here is ours or the patch's, never upstream drift.
      # Not pushed anywhere; the build succeeding is the whole test.
      - name: Build image
        run: docker build --tag spotify-companion:ci .

  # U8 (BR-64.1, P-61): gitleaks over the commits this push or PR adds. The binary is PINNED by version AND
  # SHA-256 (checked before it runs), not a third-party action -- no licence-key condition, no extra token scope.
  # --redact always: a finding never prints the value. Allow-list: .gitleaks.toml, every entry with a reason.
  # The whole history is scanned weekly by secret-history.yml.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # The range: a PR's own commits, or a push's before..after. A new branch's first push (before = all zeros)
      # and a manual run fall back to the whole history -- slower, never narrower.
      - name: Scan the commits in this change
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Scanning $BASE..$HEAD"
            ./gitleaks git --redact --no-banner -c .gitleaks.toml --log-opts="$BASE..$HEAD" .
          else
            echo "No usable base -- scanning the whole history"
            ./gitleaks git --redact --no-banner -c .gitleaks.toml .
          fi

  # U9 (BR-72, P-70/P-71/P-72, IN-U9-4): publish the image -- ONLY for a pushed `v*` tag, ONLY after the same three
  # jobs that guard `main` pass. NOT a required check (a check that runs only on tags would block every PR):
  # test/rulesetMatchesWorkflow.test.ts asserts that.
  #
  # ⚠️ This is the one job that can WRITE to the registry. So: `packages: write` is granted here and nowhere else;
  # the only action is actions/checkout, pinned by full SHA (credentials not persisted); everything else is the
  # runner's own docker CLI. The decision runs inside node:22.23 (no npm install beside the token).
  publish:
    name: Publish image (release tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, container, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialise per tag, never cancel: "is this version already published?" and the push must not race.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/kuhndj67/spotify-companion
      NODE_IMAGE: node:22.23-bookworm-slim
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Log in to GHCR (token on stdin, this job only)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # BR-72.2/72.3: tag == v + package.json, and the version is not already published. "Could not ask" refuses.
      - name: Decide (LC-64)
        run: |
          VERSION="$(jq -r .version package.json)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if out="$(docker manifest inspect "$IMAGE:$VERSION" 2>&1)"; then REGISTRY=present
          elif printf '%s' "$out" | grep -qiE 'manifest unknown|not found'; then REGISTRY=absent
          else REGISTRY=unknown; echo "registry answer: $out"; fi
          docker run --rm -v "$PWD/scripts/lib:/lib:ro" "$NODE_IMAGE" \
            node /lib/publishDecision.ts --tag "$GITHUB_REF_NAME" --version "$VERSION" --registry "$REGISTRY"

      # NFR Design Q4 = A: the base image's patch floats; record exactly which one this image was built on.
      - name: Build (linux/amd64)
        run: |
          docker pull --platform linux/amd64 "$NODE_IMAGE"
          BASE_DIGEST="$(docker inspect -f '{{index .RepoDigests 0}}' "$NODE_IMAGE")"
          docker build --platform linux/amd64 \
            --build-arg APP_VERSION="$VERSION" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --build-arg BASE_DIGEST="$BASE_DIGEST" \
            --tag "$IMAGE:$VERSION" .

      - name: Check the image before it leaves (LC-66)
        run: bash scripts/check-image.sh "$IMAGE:$VERSION"

      # No floating tag (BR-72.4): only the version is pushed.
      - name: Push
        run: docker push "$IMAGE:$VERSION"
