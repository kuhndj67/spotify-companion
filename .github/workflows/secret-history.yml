name: Secret history scan

# U8 (BR-64.2, P-61): the WHOLE history, weekly. CI's `Secret scan` job covers each change's own commits; this
# catches what a rule added in a newer gitleaks would find in old commits, and anything that reached the history by
# a path the range scan did not see. A finding here is a ROTATION, not a deletion (BR-64.5, P-64).
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    env:
      # Keep in step with ci.yml's `secrets` job.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the whole history
        run: |
          echo "Commits: $(git rev-list --all --count)"
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .
