# U6 — the VERIFICATION INSTALLATION (IN-U6-3, deployment-architecture.md §2).
#
# A second, throwaway copy of the app for U6's exit test: back up the LIVE app, restore into THIS one, check it
# runs. The cross-machine half of that test is U11's (the NAS; renumbered twice on 2026-10-18).
#
# ⚠️ NEVER run this file together with compose.yaml (`-f compose.yaml -f compose.verify.yaml`): merging would pull
# in the live service. Use `npm run verify:up` / `npm run verify:down`, which refuse unless the project name
# below resolves, and which PROVE the live deployment unchanged afterwards.
#
# ⚠️ `name:` IS LOAD-BEARING. The live deployment's Compose project is `spotify` — derived from this directory's
# name (measured 2026-10-07). Without an explicit name, this file would share that project, and its `down` could
# act on the live one.
name: spotify-verify

services:
  spotify-companion:
    # ⚠️ The live image, by tag. NO `build:` — this file can never rebuild or re-tag the live image. And removal
    # never uses `--rmi`, which would delete that shared tag.
    # U8 (P-58, BR-66.1): MUST equal package.json's version -- test/versionSources.test.ts fails otherwise.
    # Compose cannot read package.json, so this is a checked copy, not a second source. Change it with the version.
    # U9: `npm run verify:up -- --candidate` sets VERIFY_IMAGE to an image built from the working tree
    # (`spotify-companion:candidate`, never a version tag), so a change can be accepted here BEFORE it is released.
    image: ${VERIFY_IMAGE:-spotify-companion:1.0.0-beta.6}
    container_name: spotify-companion-verify
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOCAL_ONLY: "true"
      TRUST_PUBLISHED_PORT: "true"
      # Effectively idle — and with no real credentials it cannot poll Spotify anyway.
      # U9: `--poll-ms <n>` overrides it for an acceptance run that must see real polls (BR-70).
      POLL_INTERVAL_MS: ${VERIFY_POLL_INTERVAL_MS:-3600000}
      SPOTIFY_CONFIG_PATH: /app/secrets/spotify-config.json
      HISTORY_DB_PATH: /data/history.db
      SNAPSHOTS_ENABLED: "false"
      # No MusicBrainz traffic, and so no need for the contact-address secret.
      LABELS_ENABLED: "false"
      RULES_PATH: /config/rules.json
      # ⚠️ The skip machinery is never even built, and state/ starts empty (automation OFF): this copy cannot
      # skip a track on the user's account.
      SKIP_EXECUTOR_ENABLED: "false"
      AUTOMATION_STATE_PATH: /state/automation-state.json
    volumes:
      # ⚠️ A PLACEHOLDER copied from secrets/spotify-config.example.json — NEVER the live file. If Spotify
      # rotates refresh tokens, a second container refreshing a copy of the live token could invalidate it.
      # U9 (IN-U9-1): the secrets DIRECTORY, like live, so the rename-based writes are exercised as they run live.
      - ./verify-install/secrets/app:/app/secrets:rw
      - ./verify-install/data:/data:rw
      # U7 (IN-U7-1): :rw like the live mount, so the exit test exercises the real mode — rules upload, undo, restore.
      - ./verify-install/config:/config:rw
      - ./verify-install/state:/state:rw
    # Needed: a staged restore exits 0 and relies on Docker to bring the app back (probed 2026-10-07).
    restart: unless-stopped
