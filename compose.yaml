# Local deployment on Rancher Desktop.
#
# Works with either Rancher Desktop container engine:
#   dockerd (moby)  ->  docker compose up --build
#   containerd      ->  nerdctl compose up --build

services:
  spotify-companion:
    build:
      context: .
      args:
        # Pinned since 2026-08-25, closing risk R7: upstream has no release tags, so `main` can move underneath you
        # and silently change the getNowPlaying output the parser depends on. Pinning also makes the CI Docker-build
        # job a real drift detector: against a SHA a failure is unambiguously ours.
        # U9 (FR-73, NFR-40): moved 2026-10-18 from 7b5fde63 (unlicensed) to the MIT-licensed commit below. Moving it
        # again is deliberate work that repeats U9's acceptance (BR-70); Dependabot never moves it. This is the ONE
        # pin: CI's PBT-66 fetch and `npm run mcp:setup` both read it from here.
        #   6065ce5c (2026-10-16) "Add MIT license"
        MCP_SERVER_REF: 6065ce5cdef13ffeb43042e295bb788ce7ad00df
    # U8 (P-58, BR-66.1): MUST equal package.json's version -- test/versionSources.test.ts fails otherwise.
    # Compose cannot read package.json, so this is a checked copy, not a second source. Change it with the version.
    # U9 (BR-71.1): one name everywhere -- image, container, service. ⚠️ Until 1.0.0-beta.2 the service was `now-playing`
    # and the container `spotify-now-playing`: Compose treats that old container as an ORPHAN that `up` and `down` leave
    # RUNNING, so stop it first (docs/INSTALL-DEV.md, Updating). `npm run release -- --apply` refuses while it runs.
    image: spotify-companion:1.0.0-beta.8
    container_name: spotify-companion

    ports:
      # 127.0.0.1 binding keeps this localhost-only (Question 7, option A). ⚠️ Do NOT drop the prefix: see below.
      #
      # ⚠️ This binding is now LOAD-BEARING, not just tidy. With TRUST_PUBLISHED_PORT enabled
      # below, the peer-address check no longer constrains reachability — this does. Removing
      # the 127.0.0.1 prefix would put an unauthenticated view of listening history and playback
      # control on the LAN.
      #
      # Host port 3010 by default (3000 is taken on the owner's machine by another project). U8: if 3010 is taken on
      # yours, set SPOTIFY_COMPANION_PORT in a `.env` file beside this one (gitignored) -- docs/INSTALL-DEV.md S7.
      # Probed 2026-10-14: the variable is read from `.env` and from the shell. The access guard checks host NAMES,
      # never the port, so any port works. The container-internal port stays 3000.
      - "127.0.0.1:${SPOTIFY_COMPANION_PORT:-3010}:3000"

    environment:
      PORT: 3000
      # Must be 0.0.0.0 inside the container to receive traffic from the published port.
      # Host exposure is constrained by the 127.0.0.1 binding above, and LOCAL_ONLY rejects
      # anything non-loopback that arrives anyway (Q7/Q9).
      HOST: 0.0.0.0
      LOCAL_ONLY: "true"
      # Open item 1, CLOSED 2026-09-05 by user decision: security-test-instructions.md option B.
      #
      # Published-port traffic arrives from the Docker bridge gateway, never from loopback, so
      # the peer check refused EVERY request and the container UI was unusable. This disables
      # that check ONLY. Host/Origin validation — the DNS-rebinding defence — stays in force.
      #
      # Measured before choosing it: the default bridge network is empty and this machine's
      # other compose projects are on their own networks, so no container can reach this app.
      # The residual exposure is host-local processes, which is equally true of `npm start`.
      #
      # It is opt-in rather than inferred from being in a container, so it stays visible here
      # rather than switching on silently. The host deployment keeps the strict check.
      TRUST_PUBLISHED_PORT: "true"
      POLL_INTERVAL_MS: 3000
      # Shared with the MCP server: `npm run auth` writes it, the MCP server refreshes it, the app reads it (and
      # writes it only from Settings, through CredentialsWriter). U9 (BR-69.4): inside the ./secrets/app DIRECTORY mount,
      # where a temp-then-rename write works. The app passes this same path to the connector when it spawns it.
      SPOTIFY_CONFIG_PATH: /app/secrets/spotify-config.json

      # -- U1: listening history ------------------------------------------------
      HISTORY_DB_PATH: /data/history.db
      # Ratio of listened time to duration at or above which a play counts as completed.
      # Changing this does not rewrite existing verdicts — stored trails allow the change to be
      # applied retroactively via reclassification rather than only going forward.
      COMPLETION_THRESHOLD: "0.90"
      # FR-80 (U10): automatic backups, kept in /data/backups/scheduled/ (restorable archives, rotated). The
      # names are U1's, kept so existing folders need no edit. SNAPSHOT_DIR is no longer read.
      SNAPSHOT_INTERVAL_HOURS: 24
      SNAPSHOT_KEEP: 14

      # -- U2: label enrichment -------------------------------------------------
      # These values are the same as the code defaults, stated explicitly so the
      # deployment is self-describing rather than implying the code says otherwise.
      #
      # The TTLs are MEASUREMENT parameters and belong beside COMPLETION_THRESHOLD:
      # an `unknown` is retried because MusicBrainz's *completeness* changes, and a
      # success because the underlying *fact* can change (an artist signs). Without
      # the second, the version chain could only ever record unknown -> known and
      # never independent -> major, which is the case it exists for.
      LABEL_TTL_UNKNOWN_DAYS: 30
      LABEL_TTL_RESOLVED_DAYS: 90

      # Backfill pacing. Bounded per sweep so a backlog cannot monopolise the single
      # 1 req/sec queue for hours; the next sweep resumes, because the work set is a
      # query over the database rather than a stored cursor.
      LABEL_BACKFILL_INTERVAL_HOURS: 6
      LABEL_BACKFILL_BATCH: 25

      # Overridable so BR-1.2's regression test can point at a fixture stub. The
      # two-call chain must stay two calls: `inc=` is SILENTLY IGNORED on the ISRC
      # endpoint, so a test asserting "no releases" would pass against the bug.
      MUSICBRAINZ_BASE_URL: https://musicbrainz.org/ws/2

      # -- U3: rule definitions -------------------------------------------------
      # Only the PATH is configurable. The bounds are not: MAX_PREDICATE_DEPTH (32),
      # MAX_RULES (1000) and MAX_RULES_FILE_BYTES (1 MiB) are constants in code, for
      # the same reason the MusicBrainz spacing below is. A depth limit that can be
      # raised from the environment will be raised at the moment it first refuses
      # something -- which is the moment it is doing its job.
      #
      # As of U4 this IS read: the rule set is loaded from here and re-read on a poll.
      RULES_PATH: /config/rules.json

      # -- U4: rule observability ----------------------------------------------
      # Operational cadence, exactly like POLL_INTERVAL_MS above.
      #
      # ⚠️ This is a POLL, not a watch, and that is not a style choice. `fs.watch` was
      # probed on 2026-09-20 over this very bind mount: ZERO events in 12 seconds for
      # both an in-place write and a rename, while the container read the new content
      # within 1 second. It registers, throws nothing, and never calls back. The poll
      # interval IS the debounce; there is no separate one.
      RULES_POLL_INTERVAL_MS: 5000

      # ⚠️ THE ONLY NUMBER IN U4 OPENLY ADMITTED TO BE UNMEASURED, and a setting for
      # exactly that reason -- tuning it must not need a rebuild.
      #
      # A decision is taken at the first tick where enrichment has settled, or on this
      # deadline, whichever comes first. The enrichment latency it waits on has never
      # been measured: the 0.2s figure that looked like a measurement was `resolvedAt`
      # stamped BEFORE the two MusicBrainz calls, so it recorded initiation. The
      # `partialData` rate this produces is the first real measurement of it.
      #
      # ⚠️ Raising it widens a measured blind spot. A play that ENDS before the deadline
      # produces no decision row at all -- 2.8% of plays and 4 of 31 skips at 10s,
      # 3.5% and 5 of 31 at 15s. Re-measure before changing it.
      ENRICHMENT_WAIT_MS: 10000

      # The decision-log cap (100,000 rows) and the back-test cap (50,000 plays) are NOT
      # here, for the same reason the predicate bounds are not: a limit that can be
      # raised from the environment will be raised at the moment it first refuses
      # something, which is the moment it is doing its job.

      # -- U5: automated skipping ----------------------------------------------
      #
      # ⚠️ **THE DEPLOYMENT-TIME POSTURE, NOT THE KILL SWITCH.** These answer different questions
      # and are deliberately not redundant:
      #
      #   SKIP_EXECUTOR_ENABLED  is the skip machinery BUILT at all?   this file + a restart
      #   globalAutomationEnabled  may a built attempt FIRE?           one UI click, re-read at
      #                                                                every action point
      #
      # ⚠️ Collapsing them would break FR-38: a control that needs a restart cannot satisfy
      # "no skip is issued after the switch is thrown". And dropping this one would lose the
      # ability to deploy U5 **inert** for the dry-run review, which is BR-40.1's actual arming
      # gate.
      #
      # With this unset, NOTHING is constructed: no player client, no drain, no attempt rows.
      # The rules engine keeps evaluating and logging exactly as it did in U4.
      # ⚠️ FLIPPED TO "true" 2026-10-04, to make the kill switch usable. This BUILDS the machinery;
      # it ARMS NOTHING. `globalAutomationEnabled` is still false and is still the only thing that
      # lets an attempt fire — so with this true and that false, the app still cannot skip a track.
      SKIP_EXECUTOR_ENABLED: "true"

      # Where the kill switch and the runaway latch live. See the ./state mount below.
      #
      # ⚠️ NOT under /config, and NOT under /data. Both were considered and rejected -- the
      # reasons are on the mount, because that is where someone would go to change it.
      AUTOMATION_STATE_PATH: /state/automation-state.json

      # ⚠️ The BR-35 safety thresholds -- 3 consecutive rule-skips, 10 per rolling hour -- are
      # NOT here, and that needs saying because every other cadence in this file IS.
      #
      # They are PRE-REGISTERED CONSTANTS, like the hypothesis gate's thresholds and unlike
      # POLL_INTERVAL_MS. The limit is reachable by a legitimate rule: the busiest rolling hour
      # in the corpus holds 27 plays, so 10/hour trips on anything matching more than ~37% at
      # peak. ⚠️ The moment it is an env var, the obvious response to a halt is to raise it --
      # and the guard becomes decorative. Change them by amending the pre-registration.

      # NOTE: request spacing (1 req/sec, NFR-15) and the retry policy are NOT
      # settings. There is no legitimate value other than one per second, so a knob
      # here would exist only to violate the policy -- most likely while debugging,
      # and then forgotten. They are constants in code.
      #
      # The NFR-14 contact address is NOT here either: this file is TRACKED IN GIT,
      # and a personal contact address is the user's data rather than project
      # configuration. It lives in secrets/app/musicbrainz.json, mounted below, and the
      # app fails to start without it rather than sending anonymous traffic.
      #
      # NOTE: this used to say "and the repository is public". That was WRONG -- the
      # repo is private (checked 2026-09-26) -- and it had been cited elsewhere as
      # the authority for the same claim. Tracked-in-git is the reason that actually
      # holds; it does not change if the repo's visibility does.

    volumes:
      # Credentials (Question 6, option A: authenticate once on the host). U9 (BR-69.4, IN-U9-1): the DIRECTORY is
      # mounted, read-write. Both writers -- the connector refreshing its token, CredentialsWriter saving Settings --
      # write by temp file + rename, which needs the directory: through the single-file mounts used until 1.0.0-beta.2
      # a rename fails with EBUSY (probed 2026-10-18). Only the app's own SUBFOLDER is mounted (1.0.0-beta.5): host
      # secrets/app/spotify-config.json and secrets/app/musicbrainz.json. The rest of secrets/ (templates, other tools'
      # credentials such as Metabase's) stays out of the container: least privilege.
      - ./secrets/app:/app/secrets:rw

      # Listening history (NFR-11): survives `compose up --build`.
      #
      # The DIRECTORY is mounted, not the file. SQLite's -wal and -shm siblings must live beside
      # the database or crash recovery breaks — copying the single-file secrets mount pattern
      # above would be a subtle and hard-to-diagnose mistake.
      - ./data:/data:rw

      # NFR-14 contact address (U2): secrets/app/musicbrainz.json arrives through the ./secrets/app directory mount above.
      # The app writes only its `contact` field, from Settings (FR-70, U7), now by temp + rename (U9, BR-69.6).

      # Rule definitions (U3) — WRITABLE BY THE APP since U7 (IN-U7-1, FD Q1 = A).
      #
      # 1. THE RULE NOW. ./config holds the rules. The app writes them ONLY through `RulesWriter`
      #    (src/configuration/): the upload is validated by the same parser that loads the file, compared, shown,
      #    confirmed — with a typed REPLACE when it would remove all or most rules, or when its base is unknown —
      #    hash-checked against the file under a lock, the previous version kept as rules.previous.json, written by
      #    temp-then-rename, and reported only once the rules engine has reloaded it (BR-53, BR-54). It writes
      #    NOTHING else here. Those guards, not this mount, are what protect a hand-authored rules.json now.
      #
      # 2. WHAT STILL HOLDS. App-written RUNTIME state lives in ./state, not here. ⚠️ The automation kill switch
      #    must NEVER move into this directory: anything that may edit rules — a person, the app, a future AI agent —
      #    must not be able to reach the switch that stops it. `RulesWriter` imports nothing from src/playback/, and
      #    a test pins that.
      #
      # 3. WHY A DIRECTORY MOUNT. A single-file bind mount binds an INODE, and temp-then-rename REPLACES the inode:
      #    through a single-file mount the rename fails or silently detaches the container's view. Since U7 this is
      #    live, not theoretical — `RulesWriter` does exactly that rename. Same reason as ./data (SQLite's -wal/-shm)
      #    and ./state (the kill switch).
      #
      # 4. HISTORY, CONDENSED. This was :ro from U3 to U6 on purpose, and its comment was corrected twice
      #    (2026-09-21: "becomes :rw at U4" — U4 had no editor; 2026-10-03: right outcome, wrong reason) so that no
      #    session would loosen it early. ⚠️ The reason it was :ro still matters: BR-20.8's last-known-good reload
      #    protects against a MALFORMED file, not a valid-but-EMPTY one, which parses fine. BR-54.1's typed
      #    confirmation for mass removal is what now covers that case. Loosened deliberately, 2026-10-08.
      #
      # NOT under ./data on purpose: that directory holds history.db, the one artefact that cannot be regenerated,
      # and rules travel separately in a backup (and are restored only if the user opts in, FR-72).
      #
      # ⚠️ Run `npm run rules:init` BEFORE the first `compose up`.
      #
      # ⚠️ CORRECTED 2026-09-21: the reason previously given for that was stated as fact and was NOT observed on
      # this host — that Docker creates a missing bind-mount source directory owned by ROOT, leaving the app (which
      # drops to `node`) unable to read its own rules. Real on a Linux host; measured 2026-09-11 on Rancher Desktop /
      # Windows, it does not occur (the mount synthesises `rwxrwxrwx root:root`). Keep the script; do not cite the
      # root-ownership reason as if it had been seen here.
      - ./config:/config:rw

      # -- U5: the kill switch and the runaway latch -----------------------------
      #
      # ⚠️ THE FIRST DIRECTORY THIS APP IS ALLOWED TO WRITE, other than ./data.
      #
      # It holds `automation-state.json`: `globalAutomationEnabled` (FR-47) and `runawayHalt`
      # (BR-35). Two separate latches -- the user turning automation off and the system halting
      # itself are different facts, and clearing them are different acts.
      #
      # The DIRECTORY is mounted, not the file, for the reason given on ./config above and on
      # ./data before it: a single-file bind mount binds an INODE, and the safe way to write a
      # config file is write-temp-then-rename, which REPLACES the inode. ⚠️ Here that hazard is
      # LIVE rather than theoretical -- `AutomationStateStore.write` does exactly that rename, so
      # a single-file mount would detach the container's view on the first kill-switch change.
      # U3 and U4 could only describe this bug; U5 would hit it.
      #
      # ⚠️ WHY NOT ./config: that is where RULES are edited — by a person, by the app since U7, and perhaps one day
      # by an agent. A kill switch in the same writable directory as the file an editor changes is a kill switch
      # that editor can reach. See the note on that mount.
      #
      # ⚠️ WHY NOT ./data, which is already :rw -- and this is the less obvious half. It is about
      # RESTORE. Once W-5's full-inventory backup exists, restoring a week-old backup would
      # restore the week-old LATCH along with the plays, and a kill switch that a database
      # restore can silently re-arm is not a kill switch. Keeping it on its own mount means a
      # history restore cannot change whether this app is allowed to touch playback.
      #
      # ⚠️ `probeWritable` checks this mount AT STARTUP and reports on /api/diagnostics, because
      # the answer has to be known BEFORE the user reaches for the switch. Verify it THROUGH THE
      # CONTAINER: on the host the write succeeds and the bug is invisible.
      - ./state:/state:rw

    restart: unless-stopped
