# Local deployment on Rancher Desktop.
#
# Works with either Rancher Desktop container engine:
#   dockerd (moby)  ->  docker compose up --build
#   containerd      ->  nerdctl compose up --build

services:
  now-playing:
    build:
      context: .
      args:
        # Pinned 2026-08-25, closing risk R7. Upstream declares no license and no release tags,
        # so `main` can move underneath you and silently change the getNowPlaying output the
        # parser depends on. Pinning also makes the CI Docker-build job a real drift detector:
        # against `main` a failure was ambiguous, against a SHA it is unambiguously ours.
        #   7b5fde63 (2026-08-21) "fix: add offset param to getMyPlaylists (#72)"
        MCP_SERVER_REF: 7b5fde6309a52a7874768c63deda7880ee85935b
    image: spotify-now-playing:0.1.0
    container_name: spotify-now-playing

    ports:
      # 127.0.0.1 binding keeps this localhost-only (Question 7, option A).
      # Drop the prefix to "3010:3000" to expose it on the LAN.
      #
      # ⚠️ This binding is now LOAD-BEARING, not just tidy. With TRUST_PUBLISHED_PORT enabled
      # below, the peer-address check no longer constrains reachability — this does. Removing
      # the 127.0.0.1 prefix would put an unauthenticated view of listening history and playback
      # control on the LAN.
      #
      # Host port 3010, not 3000: 3000 is taken on this machine by another project
      # (opencodetest-frontend). The container-internal port stays 3000.
      - "127.0.0.1:3010:3000"

    environment:
      PORT: 3000
      # Must be 0.0.0.0 inside the container to receive traffic from the published port.
      # Host exposure is constrained by the 127.0.0.1 binding above, and LOCAL_ONLY rejects
      # anything non-loopback that arrives anyway (Q7/Q9).
      HOST: 0.0.0.0
      LOCAL_ONLY: "true"
      # Open item 1, CLOSED 2026-09-05 by user decision: security-test-instructions.md option B.
      #
      # Published-port traffic arrives from the Docker bridge gateway, never from loopback, so
      # the peer check refused EVERY request and the container UI was unusable. This disables
      # that check ONLY. Host/Origin validation — the DNS-rebinding defence — stays in force.
      #
      # Measured before choosing it: the default bridge network is empty and this machine's
      # other compose projects are on their own networks, so no container can reach this app.
      # The residual exposure is host-local processes, which is equally true of `npm start`.
      #
      # It is opt-in rather than inferred from being in a container, so it stays visible here
      # rather than switching on silently. The host deployment keeps the strict check.
      TRUST_PUBLISHED_PORT: "true"
      POLL_INTERVAL_MS: 3000
      # Shared with the MCP server: `npm run auth` writes it, the MCP server refreshes it,
      # this app reads it. The app never writes, to avoid racing the MCP server's rewrites.
      SPOTIFY_CONFIG_PATH: /opt/spotify-mcp/spotify-config.json

      # -- U1: listening history ------------------------------------------------
      HISTORY_DB_PATH: /data/history.db
      # Ratio of listened time to duration at or above which a play counts as completed.
      # Changing this does not rewrite existing verdicts — stored trails allow the change to be
      # applied retroactively via reclassification rather than only going forward.
      COMPLETION_THRESHOLD: "0.90"
      # FR-56: automatic dated snapshots. Listening history is the only artefact here that
      # cannot be regenerated, and relying on remembering to export fails silently.
      SNAPSHOT_DIR: /data/snapshots
      SNAPSHOT_INTERVAL_HOURS: 24
      SNAPSHOT_KEEP: 14

      # -- U2: label enrichment -------------------------------------------------
      # These values are the same as the code defaults, stated explicitly so the
      # deployment is self-describing rather than implying the code says otherwise.
      #
      # The TTLs are MEASUREMENT parameters and belong beside COMPLETION_THRESHOLD:
      # an `unknown` is retried because MusicBrainz's *completeness* changes, and a
      # success because the underlying *fact* can change (an artist signs). Without
      # the second, the version chain could only ever record unknown -> known and
      # never independent -> major, which is the case it exists for.
      LABEL_TTL_UNKNOWN_DAYS: 30
      LABEL_TTL_RESOLVED_DAYS: 90

      # Backfill pacing. Bounded per sweep so a backlog cannot monopolise the single
      # 1 req/sec queue for hours; the next sweep resumes, because the work set is a
      # query over the database rather than a stored cursor.
      LABEL_BACKFILL_INTERVAL_HOURS: 6
      LABEL_BACKFILL_BATCH: 25

      # Overridable so BR-1.2's regression test can point at a fixture stub. The
      # two-call chain must stay two calls: `inc=` is SILENTLY IGNORED on the ISRC
      # endpoint, so a test asserting "no releases" would pass against the bug.
      MUSICBRAINZ_BASE_URL: https://musicbrainz.org/ws/2

      # -- U3: rule definitions -------------------------------------------------
      # Only the PATH is configurable. The bounds are not: MAX_PREDICATE_DEPTH (32),
      # MAX_RULES (1000) and MAX_RULES_FILE_BYTES (1 MiB) are constants in code, for
      # the same reason the MusicBrainz spacing below is. A depth limit that can be
      # raised from the environment will be raised at the moment it first refuses
      # something -- which is the moment it is doing its job.
      #
      # As of U4 this IS read: the rule set is loaded from here and re-read on a poll.
      RULES_PATH: /config/rules.json

      # -- U4: rule observability ----------------------------------------------
      # Operational cadence, exactly like POLL_INTERVAL_MS above.
      #
      # ⚠️ This is a POLL, not a watch, and that is not a style choice. `fs.watch` was
      # probed on 2026-09-20 over this very bind mount: ZERO events in 12 seconds for
      # both an in-place write and a rename, while the container read the new content
      # within 1 second. It registers, throws nothing, and never calls back. The poll
      # interval IS the debounce; there is no separate one.
      RULES_POLL_INTERVAL_MS: 5000

      # ⚠️ THE ONLY NUMBER IN U4 OPENLY ADMITTED TO BE UNMEASURED, and a setting for
      # exactly that reason -- tuning it must not need a rebuild.
      #
      # A decision is taken at the first tick where enrichment has settled, or on this
      # deadline, whichever comes first. The enrichment latency it waits on has never
      # been measured: the 0.2s figure that looked like a measurement was `resolvedAt`
      # stamped BEFORE the two MusicBrainz calls, so it recorded initiation. The
      # `partialData` rate this produces is the first real measurement of it.
      #
      # ⚠️ Raising it widens a measured blind spot. A play that ENDS before the deadline
      # produces no decision row at all -- 2.8% of plays and 4 of 31 skips at 10s,
      # 3.5% and 5 of 31 at 15s. Re-measure before changing it.
      ENRICHMENT_WAIT_MS: 10000

      # The decision-log cap (100,000 rows) and the back-test cap (50,000 plays) are NOT
      # here, for the same reason the predicate bounds are not: a limit that can be
      # raised from the environment will be raised at the moment it first refuses
      # something, which is the moment it is doing its job.

      # NOTE: request spacing (1 req/sec, NFR-15) and the retry policy are NOT
      # settings. There is no legitimate value other than one per second, so a knob
      # here would exist only to violate the policy -- most likely while debugging,
      # and then forgotten. They are constants in code.
      #
      # The NFR-14 contact address is NOT here either: this file is TRACKED IN GIT,
      # and a personal contact address is the user's data rather than project
      # configuration. It lives in secrets/musicbrainz.json, mounted below, and the
      # app fails to start without it rather than sending anonymous traffic.
      #
      # NOTE: this used to say "and the repository is public". That was WRONG -- the
      # repo is private (checked 2026-09-26) -- and it had been cited elsewhere as
      # the authority for the same claim. Tracked-in-git is the reason that actually
      # holds; it does not change if the repo's visibility does.

    volumes:
      # Question 6, option A: authenticate once on the host, mount the token file in.
      # The MCP server rewrites this file when it refreshes the access token, so it is
      # mounted read-write.
      - ./secrets/spotify-config.json:/opt/spotify-mcp/spotify-config.json:rw

      # Listening history (NFR-11): survives `compose up --build`.
      #
      # The DIRECTORY is mounted, not the file. SQLite's -wal and -shm siblings must live beside
      # the database or crash recovery breaks — copying the single-file secrets mount pattern
      # above would be a subtle and hard-to-diagnose mistake.
      - ./data:/data:rw

      # NFR-14 contact address (U2). Mounted READ-ONLY, unlike the Spotify config
      # above: nothing rewrites this file, and copying the `rw` out of habit would
      # grant a write capability with no use.
      - ./secrets/musicbrainz.json:/app/secrets/musicbrainz.json:ro

      # Rule definitions (U3).
      #
      # The DIRECTORY is mounted, not the file -- the same distinction as ./data above,
      # for a different reason. A single-file bind mount binds an INODE, and the safe way
      # to write a config file is write-temp-then-rename, which REPLACES the inode. Through
      # a single-file mount that rename either fails or silently detaches the container's
      # view from the host file. U3 only reads, so the bug would be invisible here and
      # would surface the first time the U4 rule editor saves.
      #
      # READ-ONLY, like ./secrets/musicbrainz.json and unlike ./data: nothing in U3 OR U4
      # writes rules. `npm run rules:init` creates the file on the host; the app never does.
      #
      # ⚠️ CORRECTED 2026-09-21. This previously said "this becomes :rw at U4 when the
      # editor needs to write". U4 HAS NO EDITOR -- it is read-only observability, and its
      # reload button re-READS the file. Left as written, that sentence was an instruction a
      # later session would follow without re-deriving, granting a write capability a whole
      # unit before anything used it. It becomes :rw in the unit that adds RULE EDITING, and
      # not before.
      #
      # NOT under ./data on purpose. That directory holds history.db, the one artefact here
      # that cannot be regenerated. Rules are user-authored text that costs retyping.
      # Keeping the hand-edited file out of the directory nobody should hand-edit is the
      # whole point.
      #
      # ⚠️ Run `npm run rules:init` BEFORE the first `compose up`.
      #
      # ⚠️ CORRECTED 2026-09-21: the reason previously given here was stated as fact and was
      # NOT observed on this host. The claim was that Docker creates a missing bind-mount
      # source directory owned by ROOT, leaving the app -- which drops to `node` -- unable to
      # read its own rules. That hazard is real on a Linux host. Measured 2026-09-11 on
      # Rancher Desktop / Windows, it does not occur: the bind mount synthesises
      # `rwxrwxrwx root:root` regardless, so reads work.
      #
      # Keep the script; it still saves you a confusing empty rule set on first run. Do not
      # cite the root-ownership reason as if it had been seen here. An untested justification
      # repeated confidently is how a wrong reason outlives the decision it justified.
      - ./config:/config:ro

    restart: unless-stopped
